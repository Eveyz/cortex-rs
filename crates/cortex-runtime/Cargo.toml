[package]
name = "cortex-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "CortexModel, .ctxb loader, byte-fallback BPE + control tokens, constrained JSON FSM, agent tools, day/night FSM, and cortex-cli."
publish = false

[dependencies]
cortex-kernels = { path = "../cortex-kernels" }
cortex-ssm = { path = "../cortex-ssm" }
cortex-hippocampus = { path = "../cortex-hippocampus" }
cortex-sleep = { path = "../cortex-sleep" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "cortex-cli"
path = "src/main.rs"
